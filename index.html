/* ---------- build + events ---------- */
function build(){nav();$('#app').innerHTML=hero()+about()+team()+village()+maps()+journey()+categories()+activities()+gallery()+videos()+records()+dash()+foot();drawTree();count();slides()}
function count(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;$$('[data-n]').forEach(el=>{const n=+el.dataset.n;if(rm||!n){el.textContent=n;return}let t0;const f=t=>{t0=t0||t;const k=Math.min((t-t0)/900,1);el.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function lb(i){LI=i;const x=LB[i];if(!x)return;const o=$('#lb');o.hidden=false;o.innerHTML=`<img src="${esc(x.src)}" alt="${esc(x.caption)}" draggable="false"><p>${esc(x.caption)} <small>${esc(x.date||'')} ${esc(x.place||'')}</small></p><div><button data-x="-1">Previous</button><button data-x="1">Next</button><button data-x="0">Close</button></div>`;$('button[data-x="0"]',o).focus()}
document.addEventListener('contextmenu',e=>{if(e.target.closest('#lb')||e.target.closest('.gal,.thumbs'))e.preventDefault()});
document.addEventListener('keydown',e=>{const o=$('#lb');if(o.hidden)return;if(e.key==='Escape')o.hidden=true;if(e.key==='ArrowRight')lb((LI+1)%LB.length);if(e.key==='ArrowLeft')lb((LI-1+LB.length)%LB.length)});
document.addEventListener('input',e=>{if(e.target.id==='fq'){const p=e.target.selectionStart;FQ=e.target.value;$('#fgal').innerHTML=fthumbs(CURP);const q=$('#fq');q.focus();q.setSelectionRange(p,p)}if(e.target.id==='gq'){GQ=e.target.value;$('#galg').innerHTML=gal()}});
document.addEventListener('change',e=>{if(e.target.id==='gc'){GC=e.target.value;$('#galg').innerHTML=gal()}});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-lb]');if(!t)return;const d=t.dataset;
 if(d.f!==undefined){if(d.f&&Object.keys((find(buildTree(),d.f)||{k:{}}).k).length){OPEN.has(d.f)&&!t.closest('.crumb')?OPEN.delete(d.f):OPEN.add(d.f)}SEL=d.f;if(d.f){d.f.split('/').slice(0,-1).reduce((a,s)=>{a=a?a+'/'+s:s;OPEN.add(a);return a},'')}drawTree();if(d.f)$('#treeP').scrollIntoView({block:'nearest',behavior:'smooth'})}
 else if(d.lb!==undefined){const x=$('#fq');LB=t.closest('.gal')?LB:LB;lb(+d.lb)}
 else if(d.x!==undefined){const n=+d.x;n?lb((LI+n+LB.length)%LB.length):$('#lb').hidden=true}
 else if(d.m){MAP=d.m;$('#maps').outerHTML=maps()}
 else if(d.r){REG=d.r;$('#records').outerHTML=records()}
 else if(d.j)detail(d.j);else if(d.go){fwd(keyOf(d.go))}else if(d.back!==undefined){goBack()}else if(d.scroll!==undefined){$('#folders').scrollIntoView({behavior:'smooth'})}});
function detail(d){const e=J.find(x=>x.date===d),a=$('#adm');a.innerHTML=`<h3>${esc(e.title)}</h3><p><small>${wd(d)}, ${dt(d)}. ${esc(e.place)}</small></p>${e.photo?`<img src="${esc(e.photo)}" alt="" style="width:100%;margin:.6rem 0" draggable="false">`:''}<p>${esc(e.desc)}</p><p><button class="btn" id="cl">Close</button></p>`;a.showModal();$('#cl').onclick=()=>a.close()}
/* search */
function search(e){let b=$('#sr');const q=e.target.value.trim().toLowerCase();if(!q){b&&b.remove();return}if(!b){b=document.createElement('div');b.id='sr';document.body.appendChild(b)}
 const H=[];J.forEach(x=>{if((x.title+x.place+x.desc+x.date).toLowerCase().includes(q))H.push(['Journey',x.date+' '+x.title,'#d-'+x.date])});
 const T=buildTree();(function w(ns){Object.values(ns).forEach(n=>{if(n.n.toLowerCase().includes(q))H.push(['Folder',n.p,'#activities','f:'+n.p]);w(n.k)})})(T);
 P.forEach((x,i)=>{if((x.caption+x.place+x.path).toLowerCase().includes(q))H.push(['Photo',x.caption||x.path,'#gallery'])});V.forEach(v=>{if((v.title+v.place).toLowerCase().includes(q))H.push(['Video',v.title,'#videos'])});
 Object.keys(ROWS).forEach(k=>ROWS[k].forEach(r=>{if(JSON.stringify(r).toLowerCase().includes(q))H.push(['Register',k+': '+Object.values(r).filter(v=>typeof v==='string').slice(0,3).join(', '),'#records'])}));
 b.innerHTML=H.length?H.slice(0,12).map(h=>`<a href="${h[2]}" data-s="${esc(h[3]||'')}">${h[0]}: ${esc(h[1])}</a>`).join(''):'<a>No results</a>';
 b.onclick=ev=>{const s=ev.target.dataset&&ev.target.dataset.s;if(s){SEL=s.slice(2);SEL.split('/').reduce((a,x)=>{a=a?a+'/'+x:x;OPEN.add(a);return a},'');drawTree()}b.remove()}}
/* ---------- admin ---------- */
const F=(l,n,t='text')=>t==='area'?`<label>${l}<textarea name="${n}" rows="3"></textarea></label>`:`<label>${l}<input name="${n}" type="${t}"></label>`;
async function admin(){const a=$('#adm');
 if(!fb){a.innerHTML=`<h3>Admin not configured</h3><p>Add your Firebase settings to js/firebase-config.js (see README). Visitors always have read-only access.</p><p><button class="btn" id="cl">Close</button></p>`;a.showModal();$('#cl').onclick=()=>a.close();return}
 if(!user){a.innerHTML=`<h3>Administrator sign in</h3><form id="lf">${F('Email','email','email')}${F('Password','pw','password')}<p id="er" style="color:#b00"></p><button class="btn">Sign in</button> <button type="button" class="btn" id="cl">Cancel</button></form>`;a.showModal();$('#cl').onclick=()=>a.close();
  $('#lf').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;try{await fb.auth.signInWithEmailAndPassword(f.email.value,f.pw.value);a.close()}catch(x){$('#er').textContent='Sign in failed: check email and password.'}};return}
 try{const token=await user.getIdTokenResult(true);IS_ADMIN=token.claims.admin===true;}catch(e){IS_ADMIN=false}
 if(!IS_ADMIN){a.innerHTML=`<h3>Administrator access required</h3><p>This account does not have the Firebase <code>admin: true</code> permission. Viewing remains available, but uploads and edits are restricted.</p><p><button class="btn" id="cl">Close</button></p>`;a.showModal();$('#cl').onclick=()=>a.close();nav();return}
 const kinds={journey:['Journey entry',()=>F('Date','date','date')+F('Title','title')+F('Place','place')+F('Description','desc','area')+`<label>Type<select name="type">${Object.entries(TYPES).map(t=>`<option value="${t[0]}">${t[1][1]}</option>`).join('')}</select></label>`+F('Photo path or URL','photo')+F('Map search text (optional)','map')],
  photos:['Photograph',()=>F('Folder path, e.g. Farmer Visits/Coconut Farmers','path')+F('Upload image','file','file')+F('Or image path/URL','src')+F('Caption','caption')+F('Date','date','date')+F('Place','place')],
  videos:['Video',()=>F('Folder path, e.g. NGO Activities/SELVA TRUST','path')+F('Title','title')+F('Embed URL (YouTube embed link)','embed')+F('Date','date','date')+F('Place','place')+F('Category','category')],
  reg:['Register or report row',()=>`<label>Register<select name="reg">${Object.keys(R.registers).map(k=>`<option>${k}</option>`).join('')}</select></label>`+'<div id="rf"></div>']};
 a.innerHTML=`<h3>Admin panel</h3><p><small>${esc(user.email)}</small></p><label>Add<select id="kd">${Object.entries(kinds).map(k=>`<option value="${k[0]}">${k[1][0]}</option>`).join('')}</select></label><form id="af"></form><p id="er"></p><button class="btn" id="so" type="button">Sign out</button> <button class="btn" id="cl" type="button">Close</button>`;a.showModal();
 const draw=()=>{const k=$('#kd').value;$('#af').innerHTML=kinds[k][1]()+'<button class="btn">Save</button>';if(k==='reg'){const r=()=>{$('#rf').innerHTML=R.registers[$('#af').reg.value].map(h=>F(h,h)).join('');};$('#af').reg.onchange=r;r()}};
 $('#kd').onchange=draw;draw();$('#cl').onclick=()=>a.close();$('#so').onclick=()=>{fb.auth.signOut();a.close()};
 $('#af').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,k=$('#kd').value,o={};$$('input,select,textarea',f).forEach(i=>{if(i.name&&i.type!=='file'&&i.value)o[i.name]=i.value});
  try{const token=await user.getIdTokenResult(true);if(token.claims.admin!==true)throw Error('Administrator permission is required.');$('#er').textContent='Saving…';let col=k;if(k==='reg'){col='reg_'+o.reg;delete o.reg}
   if(k==='photos'){const fl=f.file.files[0];if(fl){const r=fb.st.ref('photos/'+Date.now()+'_'+fl.name);await r.put(fl);o.src=await r.getDownloadURL()}if(!o.src||!o.path)throw Error('A folder path and an image are required.')}
   await fb.db.collection(col).add(o);await refresh();const y=scrollY;build();scrollTo(0,y);$('#er').textContent='Saved.';a.close()}catch(x){$('#er').textContent='Could not save: '+x.message}}}
await initFB();await refresh();init();
})();
</script>
